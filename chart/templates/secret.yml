{{- if .Values.router.createSecret -}}
apiVersion: v1
kind: Secret
metadata:
  labels:
    app: {{ template "port-forwarding.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
  name: {{ template "port-forwarding.fullname" . }}
type: Opaque
data:
  ROUTER_URL: {{ .Values.router.url | default "" | b64enc | quote }}
  ROUTER_USERNAME: {{ .Values.router.username | default "" | b64enc | quote }}
  ROUTER_PASSWORD: {{ .Values.router.password | default "" | b64enc | quote }}
  ROUTER_RULE_PREFIX: {{ .Values.router.rule_prefix | default "" | b64enc | quote }}
  ROUTER_SKIP_TLS_VERIFICATION: {{ .Values.router.skipTlsVerification | default true | toString | b64enc | quote }}
{{- end -}}
