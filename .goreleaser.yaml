version: 2
project_name: port-forwarding-controller

builds:
  - id: manager
    main: ./cmd/manager
    binary: manager
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    format_overrides:
      - goos: windows
        format: zip

dockers:
  - image_templates:
      - "ghcr.io/ryanmcafee/port-forwarding-controller:{{ .Version }}-amd64"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
    goos: linux
    goarch: amd64

  - image_templates:
      - "ghcr.io/ryanmcafee/port-forwarding-controller:{{ .Version }}-arm64"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
    goos: linux
    goarch: arm64

  - image_templates:
      - "ghcr.io/ryanmcafee/port-forwarding-controller:{{ .Version }}-armv7"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm/v7"
    goos: linux
    goarch: arm
    goarm: "7"

docker_manifests:
  - name_template: "ghcr.io/ryanmcafee/port-forwarding-controller:{{ .Version }}"
    image_templates:
      - "ghcr.io/ryanmcafee/port-forwarding-controller:{{ .Version }}-amd64"
      - "ghcr.io/ryanmcafee/port-forwarding-controller:{{ .Version }}-arm64"
      - "ghcr.io/ryanmcafee/port-forwarding-controller:{{ .Version }}-armv7"
  - name_template: "ghcr.io/ryanmcafee/port-forwarding-controller:latest"
    image_templates:
      - "ghcr.io/ryanmcafee/port-forwarding-controller:{{ .Version }}-amd64"
      - "ghcr.io/ryanmcafee/port-forwarding-controller:{{ .Version }}-arm64"
      - "ghcr.io/ryanmcafee/port-forwarding-controller:{{ .Version }}-armv7"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

release:
  github:
    owner: ryanmcafee
    name: port-forwarding-controller
  draft: false
  prerelease: auto
  header: |
    ## Installation

    **Helm:**
    ```bash
    helm repo add port-forwarding https://ryanmcafee.github.io/port-forwarding-controller
    helm install port-forwarding port-forwarding/port-forwarding \
      --set router.url=YOUR_ROUTER_URL \
      --set router.username=YOUR_USERNAME \
      --set router.password=YOUR_PASSWORD
    ```

    **Docker:**
    ```bash
    docker pull ghcr.io/ryanmcafee/port-forwarding-controller:{{ .Version }}
    ```
