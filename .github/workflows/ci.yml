name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: jdx/mise-action@v2
      - run: golangci-lint run
      - name: Helm lint
        run: helm lint ./charts/port-forwarding --set router.url=https://test --set router.username=test --set router.password=test

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: jdx/mise-action@v2
      - name: Run tests
        run: make test
      - uses: codecov/codecov-action@v4
        if: always()

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o bin/manager ./cmd/manager

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean

  helm-e2e:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@v3

      - name: Build snapshot with goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean

      - name: Build Docker image
        run: |
          docker build -t port-forwarding-controller:test \
            --build-arg TARGETPLATFORM=linux/amd64 .

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: helm-test
          config: test/helm/kind-config.yaml

      - name: Load image into Kind
        run: kind load docker-image port-forwarding-controller:test --name helm-test

      - name: Run Helm Terratest
        env:
          KUBE_CONTEXT: kind-helm-test
          TEST_IMAGE_REPO: port-forwarding-controller
          TEST_IMAGE_TAG: test
        run: go test -v -timeout 15m ./test/helm/...

      - name: Cleanup
        if: always()
        run: kind delete cluster --name helm-test || true
