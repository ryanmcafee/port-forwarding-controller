# Default values for port-forwarding.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/ryanmcafee/port-forwarding-controller
  tag: ""  # Defaults to appVersion
  pullPolicy: IfNotPresent

rbac:
  create: true

serviceAccount:
  create: true
  name:

router:
  # Use an existing secret instead of creating one
  existingSecret: ""
  # Key names in the secret (useful when using existingSecret with different key names)
  secretKeys:
    url: ROUTER_URL
    username: ROUTER_USERNAME
    password: ROUTER_PASSWORD
    apiKey: ROUTER_API_KEY
    rulePrefix: ROUTER_RULE_PREFIX
    skipTlsVerification: ROUTER_SKIP_TLS_VERIFICATION
    deviceType: ROUTER_DEVICE_TYPE
  # Set to true to create a new secret with the values below
  createSecret: true
  url: ""
  username: ""
  password: ""
  # API key authentication (preferred over username/password when set)
  apiKey: ""
  rule_prefix: kube-
  skipTlsVerification: true
  # Device type: "standard" for legacy UniFi Controller, "udm" for UDM/UDR devices
  deviceType: "standard"

nameOverride: ""
fullnameOverride: ""

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 30Mi
  # requests:
  #   cpu: 100m
  #   memory: 20Mi

nodeSelector: {}

tolerations: []

affinity: {}
