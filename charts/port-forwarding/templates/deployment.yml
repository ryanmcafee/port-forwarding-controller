---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ include "port-forwarding.name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    release: {{ .Release.Name }}
  name: {{ include "port-forwarding.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      control-plane: controller-manager
      controller-tools.k8s.io: "1.0"
      app: {{ include "port-forwarding.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        control-plane: controller-manager
        controller-tools.k8s.io: "1.0"
        app: {{ include "port-forwarding.name" . }}
        release: {{ .Release.Name }}
    spec:
      containers:
      {{- $secretName := .Values.router.existingSecret | default (include "port-forwarding.fullname" .) }}
      {{- $useExistingSecret := .Values.router.existingSecret }}
      - command:
        - /root/manager
        env:
        - name: ROUTER_URL
          valueFrom:
            secretKeyRef:
              key: {{ .Values.router.secretKeys.url | default "ROUTER_URL" }}
              name: {{ $secretName }}
        - name: ROUTER_USERNAME
          valueFrom:
            secretKeyRef:
              key: {{ .Values.router.secretKeys.username | default "ROUTER_USERNAME" }}
              name: {{ $secretName }}
        - name: ROUTER_PASSWORD
          valueFrom:
            secretKeyRef:
              key: {{ .Values.router.secretKeys.password | default "ROUTER_PASSWORD" }}
              name: {{ $secretName }}
        - name: ROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              key: {{ .Values.router.secretKeys.apiKey | default "ROUTER_API_KEY" }}
              name: {{ $secretName }}
              optional: true
        {{- if $useExistingSecret }}
        - name: ROUTER_RULE_PREFIX
          value: {{ .Values.router.rule_prefix | default "kube-" | quote }}
        - name: ROUTER_SKIP_TLS_VERIFICATION
          value: {{ .Values.router.skipTlsVerification | default true | toString | quote }}
        {{- else }}
        - name: ROUTER_RULE_PREFIX
          valueFrom:
            secretKeyRef:
              key: {{ .Values.router.secretKeys.rulePrefix | default "ROUTER_RULE_PREFIX" }}
              name: {{ $secretName }}
        - name: ROUTER_SKIP_TLS_VERIFICATION
          valueFrom:
            secretKeyRef:
              key: {{ .Values.router.secretKeys.skipTlsVerification | default "ROUTER_SKIP_TLS_VERIFICATION" }}
              name: {{ $secretName }}
        {{- end }}
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: "{{ .Values.image.pullPolicy }}"
        name: {{ include "port-forwarding.name" . }}
        resources:
{{ toYaml .Values.resources | indent 10 }}
      terminationGracePeriodSeconds: 10
      serviceAccountName: {{ include "port-forwarding.serviceAccountName" . }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      {{- end }}
